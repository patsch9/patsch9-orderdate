name: Build and publish release

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/checks.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and source provenance
        id: version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]*(-(alpha|beta)[1-9][0-9]*)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
          prerelease=false
          if [[ "$VERSION" == *-alpha* || "$VERSION" == *-beta* ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Build tag-versioned plugin package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 tools/build-release.py "$VERSION"
          python3 tests/test-package.py "dist/patsch9-orderdate-$VERSION.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(release create "$VERSION" "patsch9-orderdate-$VERSION.zip" "patsch9-orderdate-$VERSION.zip.sha256" --verify-tag --title "Patsch9 Pickup- and Orderdate Manager $VERSION" --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); fi
          gh "${args[@]}"
